@if (isTitle) {
  <h3
    class="font-bold text-xl"
    [class.clamp-1]="!expanded"
  >
    {{ text }}
  </h3>
}

@if (!isTitle) {
  <p
    class="clamp-lines"
    [style.--lines]="collapsedLines"
    [class.clamp-lines]="!expanded"
  >
    {{ text }}
  </p> 
}

@if (showToggle) {
  <button mat-button (click)="expanded = !expanded" class="text-style">
    {{ expanded ? 'See less' : 'See more' }}
  </button>
}
